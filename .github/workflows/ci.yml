name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.runner }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            python: "3.13"
          - runner: macos-15-intel
            python: "3.9"
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Compile source
        run: python -m compileall -q src tests scripts
      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Check application field lengths
        run: python scripts/check_application_lengths.py
      - name: Build twice and verify reproducibility
        run: |
          python scripts/build.py
          cp dist/SHA256SUMS "$RUNNER_TEMP/first-SHA256SUMS"
          python scripts/build.py
          diff -u "$RUNNER_TEMP/first-SHA256SUMS" dist/SHA256SUMS
          (cd dist && shasum -a 256 -c SHA256SUMS)
      - name: Smoke-test ZipApp
        run: |
          python dist/codex-relay-0.3.0.pyz --version
          python dist/codex-relay-0.3.0.pyz --help
          ln -s codex-relay-0.3.0.pyz dist/codex-model
          dist/codex-model --version
